<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1220">
<title>VMS · 3 auto</title>
<!-- VMS 3 Auto (pagina web): stessi riquadri dell'app Android, Bluetooth dal browser (Web Bluetooth).
     Funziona con Chrome/Edge su Android e PC, su iPhone/iPad con il browser Bluefy. Serve https (o localhost).
     Canale eventi NUS 6e400003 della scheda, righe "E,<n>,<CLASSE>,<p>" e "HELLO,RF3,<versione>".
     Pulsante «Silenzio»: manda CAL:START su 6e400002 e aspetta CAL:END sul canale testo 6e400004 (ascoltato solo in quei secondi). -->
<style>
:root{--bg:#0a1220;--card:#0f1e35;--tile:#0e1c30;--txt:#e6eef8;--mut:#8aaac8;--bright:#c0d8f0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;gap:6px;
  padding:calc(4px + env(safe-area-inset-top)) 6px calc(6px + env(safe-area-inset-bottom));
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:0 4px;flex:none}
.top h1{flex:1;min-width:0;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top select,.top button{background:#1a3560;color:var(--txt);border:1.5px solid #2d5096;border-radius:8px;font-size:14px;height:36px;padding:0 10px;font-family:inherit}
.banner{background:#3a1218;border:1px solid #e63946;color:#ffd7db;border-radius:10px;padding:8px 10px;font-size:14px;flex:none}
.cards{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
@media (min-width:900px) and (min-aspect-ratio:4/3){.cards{flex-direction:row}}
.card{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--car);border-radius:12px;padding:5px 6px 6px}
.head{display:flex;align-items:center;gap:10px;padding-bottom:5px;cursor:pointer;flex:none}
.chip{background:var(--car);color:var(--carfg);font-weight:800;font-size:20px;padding:2px 12px;border-radius:8px;white-space:nowrap}
.htxt{flex:1;min-width:0}
.board{font-weight:700;font-size:13px;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:14px;height:14px;border-radius:50%;background:#e63946;flex:none;margin-right:4px}
.dot.k1{background:#f77f00} .dot.k2{background:#2dc653}
.calbtn{flex:none;background:#1a3560;color:var(--txt);border:1.5px solid #2d5096;border-radius:8px;font-size:13px;height:30px;padding:0 9px;font-family:inherit;white-space:nowrap;cursor:pointer}
.calbtn.run{background:#0b4f8a;border-color:#4dabf7}
.calbtn:disabled{opacity:.4;cursor:default}
.cards.n1 .calbtn{font-size:15px;height:36px;padding:0 12px}
.rows{flex:1;display:flex;flex-direction:column;min-height:0}
.row{flex:1;display:flex;min-height:0}
.row.hide{display:none}
.tile{flex:1;min-width:0;margin:3px;border:1.5px solid var(--c);border-radius:10px;background:var(--tile);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;overflow:hidden}
.tile .n{color:var(--c);font-weight:700;font-size:12px;line-height:1.15;white-space:pre-line}
.tile .v{font-weight:700;font-size:24px;line-height:1.2}
.tile .l{color:var(--mut);font-size:10px;min-height:12px;white-space:nowrap}
.tile.on{background:var(--c)}
.tile.on .n,.tile.on .v,.tile.on .l{color:#0a1220}
/* 1 o 2 riquadri visibili: lo spazio e' di piu', box e scritte piu' grandi */
.cards.n1 .tile .v{font-size:clamp(34px,10vmin,84px)}
.cards.n1 .tile .n{font-size:clamp(14px,3.6vmin,26px)}
.cards.n1 .tile .l{font-size:clamp(11px,2.6vmin,17px);min-height:1.2em}
.cards.n1 .chip{font-size:24px} .cards.n1 .board{font-size:15px} .cards.n1 .state{font-size:14px}
.cards.n2 .tile .v{font-size:clamp(26px,6.5vmin,52px)}
.cards.n2 .tile .n{font-size:clamp(12px,2.8vmin,18px)}
.cards.n2 .tile .l{font-size:clamp(10px,2vmin,13px)}
.cards.n2 .chip{font-size:22px}
/* un solo riquadro su schermo verticale: box su 2 colonne invece di una fila stretta */
@media (max-aspect-ratio:1/1){
  .cards.n1 .row{flex-wrap:wrap;align-content:stretch}
  .cards.n1 .tile{flex:1 1 calc(50% - 6px)}
}
.top .gear{width:36px;padding:0;font-size:19px;line-height:1;background:transparent;color:var(--mut);border-color:#1e3050}
.setpage{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;
  padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.setpage[hidden]{display:none}
.setbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.setbar h2{margin:0;font-size:18px}
.setbar button{background:#1a3560;color:var(--txt);border:1.5px solid #2d5096;border-radius:8px;font-size:14px;height:36px;padding:0 12px;font-family:inherit}
.setcard{background:var(--card);border:1px solid #1e3050;border-radius:12px;padding:12px;margin-bottom:12px}
.setopt{display:flex;gap:10px;align-items:flex-start;font-size:16px;font-weight:700;cursor:pointer}
.setopt input{width:22px;height:22px;flex:none;margin:1px 0 0}
.setnote{color:var(--mut);font-size:14px;margin:8px 0 0}
.setcard h3{margin:0 0 6px;font-size:15px;color:var(--bright)}
.helptxt{white-space:pre-line;font-size:14px;line-height:1.45}
.showlist{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.showopt{align-items:center}
.showopt .chip{font-size:17px;padding:2px 10px}
.showopt .sb{color:var(--mut);font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast{z-index:30;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;
  background:#222c3c;color:#fff;padding:8px 14px;border-radius:18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <h1 id="title">VMS · 3 auto</h1>
  <select id="lang" aria-label="Lingua"></select>
  <button id="reset">Azzera</button>
  <button id="gear" class="gear" aria-label="Impostazioni">⚙</button>
</div>
<div id="banner" class="banner" hidden></div>
<div class="cards" id="cards"></div>
<div id="toast" class="toast"></div>

<!-- impostazioni (ingranaggio): schermata sopra la principale, cosi' i collegamenti Bluetooth restano aperti -->
<div id="setPage" class="setpage" hidden>
  <div class="setbar"><button id="setBack">← Indietro</button><h2 id="setTitle">Impostazioni</h2></div>
  <div class="setcard">
    <h3 id="showTitle"></h3>
    <div class="showlist" id="showList"></div>
    <p class="setnote" id="showNote"></p>
  </div>
  <div class="setcard">
    <label class="setopt"><input type="checkbox" id="mergeSw"> <span id="mergeLbl"></span></label>
    <p class="setnote" id="mergeNote"></p>
  </div>
  <div class="setcard"><h3 id="helpTitle"></h3><div class="helptxt" id="helpTxt"></div></div>
</div>

        slots: slots.map(function (s) { return { car: s.car, id: s.devId, name: s.devName }; })
      }));
    } catch (e) { /* niente */ }
  }

  var enc = new TextEncoder(), dec = new TextDecoder();
  var slots = [];
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

  // tocco lungo (box: prova; nome scheda: scollega) senza il menu del browser
  function onPress(node, shortFn, longFn) {
    var t = null, fired = false;
    node.addEventListener('pointerdown', function () {
      fired = false; clearTimeout(t);
      t = setTimeout(function () { fired = true; if (longFn) longFn(); }, LONG_MS);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { node.addEventListener(ev, function () { clearTimeout(t); }); });
    node.addEventListener('click', function (e) {
      e.stopPropagation();
      if (fired) { fired = false; return; }
      if (shortFn) shortFn();
    });
    node.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  // ------------------------------------------------------------------ riquadri
  function buildSlot(i) {
    var sv = (saved.slots || [])[i] || {};
    var s = {
      i: i, car: sv.car || DEFAULT_CARS[i], devId: sv.id || '', devName: sv.name || '', version: '',
      dev: null, rx: null, tx: null, tc: null, gen: 0, connected: false, kind: 0, calAt: 0, calHeard: false, textBuf: '',
      stateKey: sv.id ? 'st.repick' : 'st.choose', stateArgs: null,
      count: CLASSES.map(function () { return 0; }), litUntil: CLASSES.map(function () { return 0; }),
      lastAt: CLASSES.map(function () { return 0; }), last: CLASSES.map(function () { return ''; }), tiles: [], mode: ''
    };
    var card = el('div', 'card');
    var head = el('div', 'head');
    s.chip = el('div', 'chip');
    var htxt = el('div', 'htxt');
    s.boardEl = el('div', 'board'); s.stateEl = el('div', 'state');
    htxt.appendChild(s.boardEl); htxt.appendChild(s.stateEl);
    s.dot = el('div', 'dot');
    // pulsante «Silenzio»: il tocco non deve arrivare al nome della scheda (scelta / tocco lungo = scollega)
    s.calBtn = el('button', 'calbtn');
    s.calBtn.type = 'button';
    s.calBtn.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    s.calBtn.addEventListener('click', function (e) { e.stopPropagation(); calibrate(s); });
    s.calBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    head.appendChild(s.chip); head.appendChild(htxt); head.appendChild(s.calBtn); head.appendChild(s.dot);
    onPress(s.chip, function () { rename(s); }, null);
    onPress(head, function () { chooseBoard(s); }, function () { forget(s); });
    card.appendChild(head);
    var rows = el('div', 'rows'), row1 = el('div', 'row');
    s.row1 = row1;
    s.row2 = el('div', 'row');
    CLASSES.forEach(function (c, k) {
      var t = el('div', 'tile');
      t.style.setProperty('--c', c.color);
      var n = el('div', 'n', c.label), v = el('div', 'v', '0'), l = el('div', 'l', '');
      t.appendChild(n); t.appendChild(v); t.appendChild(l);
      onPress(t, null, function () { sendTest(s, k); });
      s.tiles.push({ t: t, v: v, l: l, on: false });
      (c.v5 ? s.row2 : row1).appendChild(t);
    });
    rows.appendChild(row1); rows.appendChild(s.row2);
    card.appendChild(rows);
    s.card = card;
    return s;
  }

  function carColor(car) {
    if (CAR_COLORS[car]) return CAR_COLORS[car];
    var h = 0;
    for (var i = 0; i < car.length; i++) h = (h * 31 + car.charCodeAt(i)) >>> 0;
    return SPARE[h % SPARE.length];
  }

  function render(s) {
    var cc = carColor(s.car);
    s.card.style.setProperty('--car', cc[0]);
    s.card.style.setProperty('--carfg', cc[1]);
    s.chip.textContent = s.car || '?';
    s.boardEl.textContent = s.devId ? (s.devName || '?') + (s.version ? '  ·  ' + s.version : '') : T('board.none');
    if (s.showChip) {   // stessa auto nella pagina delle impostazioni
      s.showChip.textContent = s.car || '?';
      s.showChip.style.background = cc[0]; s.showChip.style.color = cc[1];
      s.showBoard.textContent = s.devId ? (s.devName || '?') : T('board.none');
    }
    s.stateEl.textContent = s.calAt ? T('st.cal') : T(s.stateKey, s.stateArgs);
    s.dot.className = 'dot k' + (s.calAt ? 1 : s.kind);
    s.calBtn.textContent = s.calAt ? T('cal.run', [Math.floor((Date.now() - s.calAt) / 1000)]) : T('cal.btn');
    s.calBtn.className = 'calbtn' + (s.calAt ? ' run' : '');
    s.calBtn.disabled = !s.connected && !s.calAt;
    // V4 (2.x): 4 box atomici, salvo eventi V5 arrivati comunque; V5: 7 box, oppure 5 con l'unione attiva;
    // con l'unione attiva: Ferrari 3 box (C I SU), BMW 4 box (C I P S), anche con una scheda V4
    var v4 = s.version && s.version.charAt(0) !== '5';
    var anyV5 = CLASSES.some(function (c, k) { return c.v5 && s.count[k] > 0; });
    var ck = carKey(s.car), fer = merge && ck === 'FER', bmw = merge && ck === 'BMW';
    var mm = fer ? MERGE_FER : (bmw ? MERGE_BMW : MERGE_TO);
    var mode = fer ? 'm3' : (bmw ? 'm4' : (v4 && !anyV5 ? 'v4' : (merge ? 'm5' : 'v7')));
    if (mode !== s.mode) layout(s, mode);
    var now = Date.now();
    s.tiles.forEach(function (x, k) {
      var cnt = s.count[k], lit = s.litUntil[k], at = s.lastAt[k], last = s.last[k];
      if (merge) {
        for (var m in mm) {
          if (mm[m] !== k) continue;
          cnt += s.count[m];
          lit = Math.max(lit, s.litUntil[m]);
          if (s.lastAt[m] > at) { at = s.lastAt[m]; last = s.last[m]; }
        }
      }
      var on = lit > now;
      if (on !== x.on) { x.on = on; x.t.className = 'tile' + (on ? ' on' : ''); }
      x.v.textContent = String(cnt);
      x.l.textContent = last;
    });
  }

  // disposizione dei box: v4 = C I P S; v7 = C I P S / MC MI SU; m5 = C I P / S SU;
  // m3 (Ferrari) = C I SU; m4 (BMW) = C I P S
  function layout(s, mode) {
    s.mode = mode;
    var t = s.tiles.map(function (x) { return x.t; });
    var r1 = mode === 'm5' ? [0, 1, 2] : (mode === 'm3' ? [0, 1, 6] : [0, 1, 2, 3]);
    var r2 = mode === 'm5' ? [3, 6, 4, 5] : (mode === 'm3' ? [2, 3, 4, 5] : [4, 5, 6]);
    var hidden = mode === 'm5' ? [4, 5] : (mode === 'm3' ? [2, 3, 4, 5] : (mode === 'm4' ? [4, 5, 6] : []));
    r1.forEach(function (k) { s.row1.appendChild(t[k]); });
    r2.forEach(function (k) { s.row2.appendChild(t[k]); });
    t.forEach(function (x, k) { x.style.display = hidden.indexOf(k) >= 0 ? 'none' : ''; });
    s.row2.className = 'row' + (mode === 'v4' || mode === 'm3' || mode === 'm4' ? ' hide' : '');
  }

  function setState(s, kind, key, args) { s.kind = kind; s.stateKey = key; s.stateArgs = args || null; render(s); }

  // riquadri visibili: nascosto = solo non mostrato (collegamento e conteggi continuano);
  // la classe n1/n2/n3 adatta dimensioni e disposizione allo spazio
  function applyShow() {
    var n = 0;
    slots.forEach(function (s, i) { s.card.style.display = show[i] ? '' : 'none'; if (show[i]) n++; });
    document.getElementById('cards').className = 'cards n' + n;
  }

  function buildShowList() {
    var list = document.getElementById('showList');
    slots.forEach(function (s, i) {
      var lab = el('label', 'setopt showopt'), cb = el('input');
      cb.type = 'checkbox'; cb.checked = show[i];
      s.showChip = el('span', 'chip'); s.showBoard = el('span', 'sb');
      lab.appendChild(cb); lab.appendChild(s.showChip); lab.appendChild(s.showBoard);
      cb.addEventListener('change', function () {
        if (!cb.checked && show.filter(Boolean).length <= 1) { cb.checked = true; toast(T('set.show_min')); return; }
        show[i] = cb.checked; save(); applyShow();
      });
      list.appendChild(lab);
    });
  }

  // ------------------------------------------------------------------ Bluetooth
  function chooseBoard(s) {
    if (!navigator.bluetooth) { toast(T(window.isSecureContext ? 'nobt' : 'nosecure')); return; }
    navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'VmsRF' }], optionalServices: [NUS] }).then(function (dev) {
      slots.forEach(function (o) {   // una scheda sta su un solo riquadro
        if (o !== s && o.devId && o.devId === dev.id) {
          toast(T('toast.busy', [dev.name || '', o.car]));
          detach(o); o.devId = ''; o.devName = ''; o.version = ''; setState(o, 0, 'st.choose');
        }
      });
      detach(s);
      s.devId = dev.id; s.devName = dev.name || ''; s.version = '';
      clearCounts(s);
      save();
      attach(s, dev);
    }).catch(function (e) {
      if (e && e.name === 'NotFoundError') return;   // elenco chiuso senza scegliere
      toast(T('st.error', [(e && e.message) || String(e)]));
    });
  }

  function forget(s) {
    if (!s.devId || !confirm(T('forget.ask', [s.devName || '?']))) return;
    detach(s);
    s.devId = ''; s.devName = ''; s.version = '';
    save();
    setState(s, 0, 'st.choose');
  }

  function rename(s) {
    var n = prompt(T('rename'), s.car);
    if (n === null) return;
    n = n.trim().toUpperCase().slice(0, 10);
    if (!n) return;
    s.car = n; save(); render(s);
  }

  function attach(s, dev) {
    s.dev = dev;
    s.onDisc = function () {
      if (s.dev !== dev) return;
      var was = s.connected;
      s.connected = false;
      s.calAt = 0; s.calHeard = false;
      setState(s, 0, was ? 'st.lost' : 'st.unreach');
      retry(s, s.gen);
    };
    dev.addEventListener('gattserverdisconnected', s.onDisc);
    connect(s);
  }

  function detach(s) {
    s.gen++;
    if (s.dev) {
      s.dev.removeEventListener('gattserverdisconnected', s.onDisc);
      if (s.tx && s.onVal) s.tx.removeEventListener('characteristicvaluechanged', s.onVal);
      if (s.tc && s.onText) s.tc.removeEventListener('characteristicvaluechanged', s.onText);
      try { if (s.dev.gatt.connected) s.dev.gatt.disconnect(); } catch (e) { /* niente */ }
    }
    s.dev = null; s.rx = null; s.tx = null; s.tc = null; s.connected = false; s.calAt = 0; s.calHeard = false;
  }

  function retry(s, gen) {
    setTimeout(function () { if (s.gen === gen && s.dev && !s.connected) connect(s); }, RETRY_MS);
  }

  function connect(s) {
    var dev = s.dev;
    if (!dev) return;
    var gen = ++s.gen;
    setState(s, 1, 'st.connecting');
    dev.gatt.connect().then(function (server) {
      if (gen !== s.gen) return null;
      return server.getPrimaryService(NUS).then(function (svc) {
        return Promise.all([svc.getCharacteristic(TX), svc.getCharacteristic(RX).catch(function () { return null; }),
          svc.getCharacteristic(TEXT).catch(function () { return null; })]);
      }, function (e) { e.vmsNoChannel = true; throw e; }).then(function (ch) {
        if (gen !== s.gen) return null;
        if (s.tx && s.onVal) s.tx.removeEventListener('characteristicvaluechanged', s.onVal);
        if (s.tc && s.onText) s.tc.removeEventListener('characteristicvaluechanged', s.onText);
        s.tx = ch[0]; s.rx = ch[1]; s.tc = ch[2];
        if (s.tc) {   // ascoltato solo durante la calibrazione (startNotifications in calibrate)
          s.onText = function (ev) {
            var v = ev.target.value;
            onText(s, gen, dec.decode(new Uint8Array(v.buffer, v.byteOffset, v.byteLength)));
          };
          s.tc.addEventListener('characteristicvaluechanged', s.onText);
        }
        s.onVal = function (ev) {
          var v = ev.target.value;
          onLine(s, gen, dec.decode(new Uint8Array(v.buffer, v.byteOffset, v.byteLength)));
        };
        s.tx.addEventListener('characteristicvaluechanged', s.onVal);
        setState(s, 1, 'st.subscribing');
        return s.tx.startNotifications();
      }).then(function () {
        if (gen !== s.gen) return;
        s.connected = true;
        setState(s, 2, 'st.connected');
      });
    }).catch(function (e) {
      if (gen !== s.gen) return;
      s.connected = false;
      if (e && e.vmsNoChannel) setState(s, 0, 'st.nochan'); else setState(s, 0, 'st.unreach');
      retry(s, gen);
    });
  }

  function onLine(s, gen, line) {
    if (gen !== s.gen) return;
    var p = line.replace(/[\0\r\n]/g, '').trim().split(',');
    if (p.length >= 3 && p[0] === 'HELLO') { s.version = p[2]; render(s); return; }
    if (p.length < 3 || p[0] !== 'E') return;
    var k = -1;
    for (var i = 0; i < CLASSES.length; i++) if (CLASSES[i].wire === p[2]) k = i;
    if (k < 0) return;
    s.count[k]++;
    s.litUntil[k] = Date.now() + HOLD_MS;
    s.lastAt[k] = Date.now();
    var d = new Date();
    s.last[k] = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + (p.length >= 4 ? '  ' + p[3] : '');
    render(s);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  // prova: la scheda rimanda l'evento a tutti i ricevitori (anche alla striscia LED dell'auto)
  function sendTest(s, k) {
    if (!s.connected || !s.rx) { toast(T('toast.notconn', [s.car])); return; }
    var data = enc.encode('T,' + CLASSES[k].wire);
    var w = s.rx.writeValueWithResponse ? s.rx.writeValueWithResponse(data) : s.rx.writeValue(data);
    w.then(function () { toast(T('toast.test', [s.car, CLASSES[k].key])); },
      function () { toast(T('toast.testfail', [s.car])); });
  }

  // «Silenzio»: CAL:START alla scheda (stesso comando del pulsante «Ricalibra silenzio» di GPI-CAR-Pro);
  // la scheda risponde CAL:OK e, a fondo stimato, CAL:END sul canale testo, che si ascolta solo in questi secondi
  function calibrate(s) {
    if (s.calAt) { toast(T('cal.busy', [s.car])); return; }
    if (!s.connected || !s.rx) { toast(T('toast.notconn', [s.car])); return; }
    if (!confirm(T('cal.ask', [s.car]))) return;
    var gen = s.gen, tc = s.tc;
    s.calAt = Date.now(); s.calHeard = false; s.textBuf = '';
    render(s);
    var listen = tc ? tc.startNotifications().then(function () { return true; }, function () { return false; }) : Promise.resolve(false);
    listen.then(function (heard) {
      if (gen !== s.gen || !s.calAt) return;
      s.calHeard = heard;
      var data = enc.encode('CAL:START\n');
      var w = s.rx.writeValueWithResponse ? s.rx.writeValueWithResponse(data) : s.rx.writeValue(data);
      w.then(function () { if (s.calAt) toast(T('cal.sent', [s.car])); },
        function () { calDone(s, false); toast(T('cal.fail', [s.car])); });
    });
  }

  function onText(s, gen, chunk) {
    if (gen !== s.gen || !s.calAt) return;
    var parts = (s.textBuf + chunk).split('\n');
    s.textBuf = parts.pop().slice(-300);
    parts.forEach(function (line) {
      if (line.replace(/[\0\r]/g, '').trim().indexOf('CAL:END') === 0) calDone(s, true);
    });
  }

  function calDone(s, ok) {
    if (!s.calAt) return;
    var heard = s.calHeard;
    s.calAt = 0; s.calHeard = false; s.textBuf = '';
    if (heard && s.tc) s.tc.stopNotifications().catch(function () { /* niente */ });
    render(s);
    if (ok) toast(T('cal.done', [s.car]));
  }

  // a ogni giro del timer: secondi sul pulsante, fine a tempo senza canale testo, rinuncia dopo 30 s
  function calTick(s) {
    var dt = Date.now() - s.calAt;
    if (!s.calHeard && dt > CAL_BLIND_MS) { calDone(s, false); toast(T('cal.blind', [s.car])); }
    else if (dt > CAL_MAX_MS) { calDone(s, false); toast(T('cal.noack', [s.car])); }
    else render(s);
  }

  function clearCounts(s) {
    for (var k = 0; k < CLASSES.length; k++) { s.count[k] = 0; s.litUntil[k] = 0; s.lastAt[k] = 0; s.last[k] = ''; }
  }

  // dopo una ricarica: le schede gia' autorizzate si ricollegano da sole dove il browser lo permette
  function reattach() {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
    navigator.bluetooth.getDevices().then(function (list) {
      slots.forEach(function (s) {
        if (!s.devId || s.dev) return;
        for (var i = 0; i < list.length; i++) if (list[i].id === s.devId) { attach(s, list[i]); return; }
      });
    }).catch(function () { /* niente */ });
  }

  // ------------------------------------------------------------------ varie
  var toastT = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show';
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.className = 'toast'; }, 2500);
  }

  function applyLang() {
    document.documentElement.lang = LANGS[lang][0];
    document.title = T('title');
    document.getElementById('title').textContent = T('title');
    document.getElementById('reset').textContent = T('reset');
    document.getElementById('lang').setAttribute('aria-label', T('lang'));
    document.getElementById('gear').setAttribute('aria-label', T('set.title'));
    document.getElementById('setBack').textContent = T('set.back');
    document.getElementById('setTitle').textContent = T('set.title');
    document.getElementById('mergeLbl').textContent = T('set.merge');
    document.getElementById('mergeNote').textContent = T('set.merge_note');
    document.getElementById('showTitle').textContent = T('set.show');
    document.getElementById('showNote').textContent = T('set.show_note');
    document.getElementById('helpTitle').textContent = T('help.title');
    document.getElementById('helpTxt').textContent = T('help');
    var b = document.getElementById('banner');
    var msg = !window.isSecureContext ? T('nosecure') : !navigator.bluetooth ? T('nobt') : '';
    b.textContent = msg; b.hidden = !msg;
    slots.forEach(render);
  }

  // schermo acceso finche' la pagina e' aperta (dove il browser lo permette)
  var lock = null;
  function wake() {
    if (!navigator.wakeLock || document.visibilityState !== 'visible' || lock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l; l.addEventListener('release', function () { lock = null; });
    }).catch(function () { /* niente */ });
  }

  function init() {
    var sel = document.getElementById('lang');
    sel.innerHTML = LANGS.map(function (l, i) { return '<option value="' + i + '">' + l[1] + '</option>'; }).join('');
    sel.value = String(lang);
    sel.addEventListener('change', function () { lang = +sel.value; save(); applyLang(); });
    document.getElementById('reset').addEventListener('click', function () {
      if (!confirm(T('reset.ask'))) return;
      slots.forEach(function (s) { clearCounts(s); render(s); });
    });
    // ingranaggio: schermata delle impostazioni; il tasto Indietro del telefono la chiude
    var page = document.getElementById('setPage');
    document.getElementById('gear').addEventListener('click', function () {
      page.hidden = false;
      try { history.pushState({ vmsSet: 1 }, ''); } catch (e) { /* niente */ }
    });
    document.getElementById('setBack').addEventListener('click', function () {
      if (history.state && history.state.vmsSet) history.back(); else page.hidden = true;
    });
    window.addEventListener('popstate', function () { page.hidden = true; });
    var sw = document.getElementById('mergeSw');
    sw.checked = merge;
    sw.addEventListener('change', function () { merge = sw.checked; save(); slots.forEach(render); });
    var box = document.getElementById('cards');
    for (var i = 0; i < 3; i++) { slots.push(buildSlot(i)); box.appendChild(slots[i].card); }
    buildShowList();
    applyShow();
    applyLang();
    setInterval(function () {   // spegne i box scaduti; calibrazione in corso
      slots.forEach(function (s) {
        if (s.calAt) calTick(s);
        else if (s.tiles.some(function (x) { return x.on; })) render(s);
      });
    }, 250);
    document.addEventListener('visibilitychange', wake);
    document.addEventListener('pointerdown', wake);
    wake();
    reattach();
  }
  init();
})();
</script>
</body>
</html>
